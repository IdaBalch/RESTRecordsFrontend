<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Records</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body>

    <div id="app">

        <h1>Alle records</h1>


        <div class="row mb-3">

            <div class="col-md-3">
                <select v-model="searchType" class="form-select">
                    <option value="title">Title</option>
                    <option value="artist">Artist</option>
                    <option value="maxDuration">Max Duration</option>
                    <option value="publicationYear">Publication Year</option>
                </select>
            </div>

            <div class="col-md-6">
                <input v-model="searchValue" class="form-control" type="text" placeholder="Enter search value"
                    @keyup.enter="searchRecords">
            </div>

            <div class="col-md-3">
                <button class="btn btn-primary" @click="searchRecords">
                    Search
                </button>

                <button class="btn btn-secondary ms-2" @click="resetSearch">
                    Reset
                </button>
            </div>

        </div>



        <table class="table table-striped table-hover">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Duration (seconds)</th>
                    <th>Publication Year</th>
                </tr>
            </thead>

            <tbody>
                <tr v-for="record in records" :key="record.id">
                    <td>{{ record.id }}</td>
                    <td>{{ record.title }}</td>
                    <td>{{ record.artist }}</td>
                    <td>{{ record.duration }}</td>
                    <td>{{ record.publicationYear }}</td>
                </tr>
            </tbody>
        </table>

        <!-- Dit Vue-indhold kommer her -->
    </div>

    <!-- Bootstrap JavaScript (valgfrit) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Din egen JavaScript-fil -->
    <script src="index.js"></script>

</body>

</html>
